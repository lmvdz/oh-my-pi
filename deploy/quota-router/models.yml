# Example only — bind addresses here must match the running gateway/switchyard.
# Prefer the snippet from render-config.sh (it fills baseUrl from --mux-url /
# --gateway-bind / --switchyard-bind).
#
# smol/task never go through Switchyard so a classifier cannot "save" them
# onto Max. advisor stays Grok so the third lineage is not a coin flip.

providers:
  mux:
    baseUrl: http://127.0.0.1:4010/v1
    api: openai-completions
    apiKey: OMP_AUTH_GATEWAY_TOKEN
    authHeader: true
    models:
      - id: cheap
        name: Quota mux (cheap / Flash)
        input: [text, image]
        contextWindow: 1000000
        maxTokens: 32000
      - id: capable
        name: Quota mux (capable / sub seat)
        input: [text, image]
        contextWindow: 1000000
        maxTokens: 128000
      - id: vision
        name: Quota mux (vision)
        input: [text, image]
        contextWindow: 262144
        maxTokens: 131072
  switchyard:
    baseUrl: http://127.0.0.1:4001/v1
    api: openai-completions
    apiKey: OMP_AUTH_GATEWAY_TOKEN
    authHeader: true
    models:
      - id: fleet
        name: Switchyard fleet (cheap-first)
        input: [text, image]
        contextWindow: 1000000
        maxTokens: 32000
      - id: ship
        name: Switchyard ship (escalate)
        input: [text, image]
        contextWindow: 1000000
        maxTokens: 128000
